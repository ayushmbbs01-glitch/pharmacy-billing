name: PharmDesk build check

on:
  push:
    branches:
      - feature/pharmdesk-responsive-ui
  pull_request:
    branches:
      - main
      - feature/pharmdesk-responsive-ui

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build app
        run: npm run build
